name: AI Crawl Economy and Mind Projection Verify
on:
  pull_request:
    paths:
      - '.github/workflows/ai-crawl-economy-verify.yml'
      - 'contracts/**'
      - 'src/**'
      - 'scripts/**'
      - 'test/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'hardhat.config.cjs'
  push:
    branches: [main, 'codex/deploy-ai-crawl-genesis-dungeon']
permissions:
  contents: read
concurrency:
  group: aicrawl-economy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Install lockfile dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript integrity
        run: npm run lint
      - name: Mind projection and Solidity contract verification
        run: npm test
      - name: Browser bundle compile
        run: npm run build
      - name: Validate offline deployment script syntax
        run: node --check scripts/deploy.cjs
